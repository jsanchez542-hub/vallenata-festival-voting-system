name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  prototype:
    name: Prototype lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint

  backend:
    name: Django checks and tests
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: festival_voting
          MYSQL_ROOT_PASSWORD: ci-root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci-root"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      DJANGO_SECRET_KEY: ci-only-key
      DB_NAME: festival_voting
      DB_USER: root
      DB_PASSWORD: ci-root
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install the MySQL client headers for mysqlclient
        run: sudo apt-get update && sudo apt-get install -y pkg-config libmysqlclient-dev
      - run: pip install -r requirements.txt ruff==0.17.2
      - run: ruff check .
      - run: ruff format --check .
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py test
