<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Página no encontrada | Festival de la Leyenda Vallenata</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#000000">
  <style>
    /* Pages serves this file at any missing address, so relative font paths would break.
       The first source is the project site on GitHub Pages, the second a local server. */
    @font-face {
      font-family: "Raleway";
      src: url("/vallenata-festival-voting-system/assets/fonts/raleway-var.woff2") format("woff2"),
        url("/assets/fonts/raleway-var.woff2") format("woff2");
      font-weight: 100 900;
      font-display: swap;
    }

    @font-face {
      font-family: "Poppins";
      src: url("/vallenata-festival-voting-system/assets/fonts/poppins-400.woff2") format("woff2"),
        url("/assets/fonts/poppins-400.woff2") format("woff2");
      font-weight: 400;
      font-display: swap;
    }

    @font-face {
      font-family: "Poppins";
      src: url("/vallenata-festival-voting-system/assets/fonts/poppins-600.woff2") format("woff2"),
        url("/assets/fonts/poppins-600.woff2") format("woff2");
      font-weight: 600;
      font-display: swap;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 1.5rem;
      background: #000000;
      color: #ffffff;
      font-family: "Poppins", "Segoe UI", system-ui, sans-serif;
      line-height: 1.6;
    }

    main {
      max-width: 32rem;
    }

    h1 {
      margin: 0 0 0.75rem;
      font-family: "Raleway", "Segoe UI", system-ui, sans-serif;
      font-size: 2.25rem;
      font-weight: 800;
      line-height: 1.1;
      letter-spacing: -0.015em;
      text-wrap: balance;
    }

    p {
      margin: 0 0 1.75rem;
      color: #ced4da;
    }

    a {
      display: inline-block;
      padding: 0.75rem 1.5rem;
      background: #dd3333;
      color: #ffffff;
      font-weight: 600;
      text-decoration: none;
      border-radius: 0.625rem;
    }

    a:hover {
      background: #b32727;
    }

    a:focus-visible {
      outline: 3px solid #ffffff;
      outline-offset: 3px;
    }
  </style>
</head>
<body>
  <main>
    <h1>No encontramos esta página</h1>
    <p>El enlace puede estar incompleto o la página ya no existe. Vuelve al inicio para ver las votaciones del prototipo.</p>
    <a id="home-link" href="/">Ir al inicio</a>
  </main>
  <script>
    const isProjectPage = location.hostname.endsWith("github.io");
    document.querySelector("#home-link").href = isProjectPage ? `/${location.pathname.split("/")[1]}/` : "/";
  </script>
</body>
</html>
