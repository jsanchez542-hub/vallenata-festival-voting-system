<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    @view-transition { navigation: auto; }
    @media (prefers-reduced-motion: reduce) { @view-transition { navigation: none; } }
  </style>
  <title>Votaciones | Festival de la Leyenda Vallenata</title>
  <meta name="description" content="Votaciones abiertas, próximas y cerradas del Festival de la Leyenda Vallenata.">
  <meta name="theme-color" content="#000000">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="assets/img/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="icon" href="assets/img/favicon-16.png" sizes="16x16" type="image/png">
  <link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
  <link rel="preload" href="assets/fonts/raleway-var.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/poppins-400.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/poppins-600.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/poppins-700.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="assets/css/tokens.css">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/layout.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/pages.css">
</head>
<body data-root="./" data-area="public" data-page="polls">
  <a class="skip-link" href="#main">Saltar al contenido</a>
  <aside class="prototype-ribbon" aria-label="Aviso sobre el prototipo">
    <div class="container"><strong>Proyecto académico en equipo</strong> del curso Desarrollo Web, Areandina. Datos de ejemplo.</div>
  </aside>
  <div data-slot="header"></div>
  <main id="main">
    <section class="page-banner on-stage" aria-labelledby="page-title">
      <div class="container">
        <h1 class="page-banner__title" id="page-title">Votaciones</h1>
        <p class="page-banner__lead" id="page-lead" hidden></p>
      </div>
    </section>
    <div class="breadcrumb-band" aria-hidden="true"></div>
    <div class="container section">
      <div class="toolbar" id="poll-filters">
        <nav aria-label="Filtrar por estado">
          <div class="segmented">
            <a class="segmented__item" data-status="" href="polls.html">Todas</a>
            <a class="segmented__item" data-status="open" href="polls.html?status=open">Abiertas</a>
            <a class="segmented__item" data-status="upcoming" href="polls.html?status=upcoming">Próximas</a>
            <a class="segmented__item" data-status="closed" href="polls.html?status=closed">Cerradas</a>
          </div>
        </nav>
        <div class="field">
          <label class="field__label" for="category-filter">Categoría</label>
          <select class="input" id="category-filter">
            <option value="">Todas las categorías</option>
          </select>
        </div>
      </div>
      <h2 class="visually-hidden" id="poll-count" aria-live="polite">Lista de votaciones</h2>
      <ul class="row-list" id="poll-list"></ul>
    </div>
  </main>
  <div data-slot="footer"></div>
  <script type="module" src="assets/js/pages/polls.js" blocking="render"></script>
</body>
</html>
